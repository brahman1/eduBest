services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edubest
      POSTGRES_USER: edubest
      POSTGRES_PASSWORD: edubest_local_only
    ports: ["127.0.0.1:5448:5432"]
    volumes: ["edubest-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edubest"]
      interval: 3s
      timeout: 3s
      retries: 15
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1038:1025", "127.0.0.1:8038:8025"]
volumes:
  edubest-db:
